spring:
  application:
    name: diagramio
  datasource:
    # Mặc định khớp docker-compose.yml; ghi đè bằng biến môi trường SPRING_DATASOURCE_*
    url: jdbc:postgresql://localhost:5432/diagram_app
    username: root
    password: secretpassword
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Schema do Flyway quản lý, Hibernate chỉ kiểm tra
  flyway:
    enabled: true

server:
  # Sau proxy/load balancer: dùng X-Forwarded-Host/Proto để ghép đúng địa chỉ bên ngoài (vd. shareUrl)
  forward-headers-strategy: framework

springdoc:
  # Sắp xếp khóa cố định để docs/openapi.yaml xuất lại không bị đổi thứ tự
  writer-with-order-by-keys: true
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-it-32chars}
  access-token-minutes: 15
  refresh-token-days: 7

diagramio:
  # Cờ bật/tắt từng chiến thuật Phase 2 (mặc định tắt để tái hiện baseline C0 khi đo ablation)
  # Ghi đè bằng DIAGRAMIO_FEATURES_<FLAG>=true hoặc FEATURE_<FLAG>=true
  features:
    list-projection: ${FEATURE_LIST_PROJECTION:false}
    read-cache: ${FEATURE_READ_CACHE:false}
    share-token-cache: ${FEATURE_SHARE_TOKEN_CACHE:false}
    etag: ${FEATURE_ETAG:false}
    gzip: ${FEATURE_GZIP:false}
    rate-limiting: ${FEATURE_RATE_LIMITING:false}
    bcrypt-bulkhead: ${FEATURE_BCRYPT_BULKHEAD:false}

